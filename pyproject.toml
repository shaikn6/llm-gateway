[project]
name = "llm-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30",
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff==0.16.2",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
# ruff's default lint rule set (no explicit [tool.ruff.lint] select here)
# has grown substantially across versions -- an unpinned "ruff>=0.4" once
# broke CI when a routine `pip install` resolved a newer ruff whose wider
# defaults flagged 141 pre-existing findings this codebase had never been
# checked against. Pinned to an exact version (see pyproject's dev extra)
# so ruff's effective rule set only changes on a deliberate version bump.
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F841"]
